    <script>
      (function() {
        try {
          var _fetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var defineWritableFetch = function(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return _fetch;
                },
                set: function(fn) {
                  _fetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              try {
                target.fetch = _fetch;
              } catch (e) {}
            }
          };

          if (typeof window !== 'undefined') {
            defineWritableFetch(window);
            if (typeof Window !== 'undefined' && Window.prototype) {
              defineWritableFetch(Window.prototype);
            }
            if (window.__proto__) {
              defineWritableFetch(window.__proto__);
              if (window.__proto__.__proto__) {
                defineWritableFetch(window.__proto__.__proto__);
              }
            }
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            defineWritableFetch(globalThis);
          }
          // Prevent theme flash on page load
          try {
            var theme = localStorage.getItem('app_theme');
            if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
              document.documentElement.classList.add('dark');
            }
          } catch (e) {}
        } catch (e) {
          // Safeguard fallback
        }
      })();
    </script>
